<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Unleashed Token Controls</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 8px;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #111;
}
.panel {
    width: min(100%, 430px);
    margin: 0 auto;
    border: 2px solid black;
    border-radius: 18px;
    padding: 9px;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.header { margin-bottom: 8px; }
.header h1 { margin: 0 0 3px 0; font-size: 18px; }
.subtext { color: #666; font-size: 12px; }
.status {
    min-height: 17px;
    margin: 6px 0 8px 0;
    color: #444;
    font-size: 12px;
}
.status.error { color: #8d0000; }

.control-section {
    margin-top: 7px;
    border: 1.5px solid black;
    border-radius: 14px;
    background: white;
    overflow: hidden;
}
.control-section summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    list-style: none;
    cursor: pointer;
    padding: 9px 11px;
    font-weight: bold;
    user-select: none;
}
.control-section summary::-webkit-details-marker { display: none; }
.control-section summary::after { content: "▸"; font-size: 15px; }
.control-section[open] summary::after { content: "▾"; }
.section-body {
    border-top: 1px solid #bbb;
    padding: 8px;
}

.resource-row, .dr-row {
    display: grid;
    align-items: center;
    gap: 6px;
    margin-bottom: 7px;
}
.resource-row {
    grid-template-columns: 48px 30px minmax(46px, .8fr) 30px 14px minmax(46px, .8fr);
}
.resource-row.single {
    grid-template-columns: 48px 30px minmax(46px, .8fr) 30px;
    max-width: 220px;
}
.resource-label, .dr-label { font-weight: bold; }
.divider { text-align: center; color: #666; }

.number-input, select, button {
    border: 2px solid black;
    border-radius: 12px;
    background: white;
}
.number-input {
    width: 100%;
    min-width: 0;
    min-height: 32px;
    padding: 4px 5px;
    text-align: center;
}
.adjust-button, .icon-button {
    min-height: 32px;
    min-width: 30px;
    padding: 0;
    cursor: pointer;
    font-weight: bold;
}

.dr-row { grid-template-columns: 64px 30px minmax(46px, 1fr) 30px; }

.dr-section {
    margin-top: 10px;
    border: 1.5px solid #777;
    border-radius: 14px;
    overflow: hidden;
    background: #fafafa;
}

.dr-section summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    list-style: none;
    cursor: pointer;
    padding: 7px 9px;
    user-select: none;
}

.dr-section summary::-webkit-details-marker {
    display: none;
}

.dr-summary-label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: bold;
}

.dr-summary-label::after {
    content: "▸";
    font-size: 14px;
}

.dr-section[open] .dr-summary-label::after {
    content: "▾";
}

.dr-total-summary {
    font-weight: bold;
    color: #333;
    white-space: nowrap;
}

.dr-sources {
    border-top: 1px solid #bbb;
    padding: 8px 9px 2px 9px;
    background: white;
}

.add-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 7px;
    margin-bottom: 9px;
}
.add-row .add-bone-picker[hidden] {
    display: none;
}
.add-row .add-bone-picker {
    min-width: 82px;
}
select { min-height: 36px; padding: 6px 8px; }
.add-row button {
    min-height: 36px;
    padding: 6px 10px;
    cursor: pointer;
    font-weight: bold;
}
.condition-list { display: grid; gap: 6px; }
.condition-row {
    border: 1px solid #888;
    border-radius: 12px;
    padding: 6px;
    background: #fafafa;
}
.condition-top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 30px 26px 30px 30px;
    align-items: center;
    gap: 4px;
}
.condition-name { font-weight: bold; }
.stack-value { text-align: center; font-weight: bold; }
.condition-help {
    display: none;
    margin-top: 7px;
    padding: 7px 8px;
    border: 1px solid #d0d0d0;
    border-radius: 11px;
    background: white;
    font-size: 12px;
    line-height: 1.35;
}
.condition-help.active { display: block; }
.condition-detail-editor {
    display: grid;
    gap: 5px;
    margin-top: 6px;
}
.condition-detail-editor.poison-details {
    grid-template-columns: minmax(90px, 1fr) minmax(82px, .8fr) 62px;
    align-items: end;
}
.condition-detail-editor.bleed-details {
    grid-template-columns: max-content;
}
.condition-detail-editor .condition-bleed-per-turn,
.condition-detail-editor .condition-poison-stacks-per-interval {
    width: 52px;
    min-width: 52px;
    max-width: 52px;
    text-align: center;
}
.condition-detail-editor label {
    display: grid;
    gap: 3px;
    font-size: 11px;
    font-weight: bold;
    color: #555;
}
.condition-detail-editor select,
.condition-detail-editor input {
    width: 100%;
    min-height: 32px;
    padding: 4px 7px;
    border: 1.5px solid #777;
    border-radius: 10px;
    background: white;
}
.empty, .loading, .error-message {
    color: #777;
    font-size: 13px;
    padding: 6px 2px;
}
.error-message { color: #8d0000; }
</style>
</head>
<body>

<div class="panel">
    <div class="header">

    </div>

                <span class="divider">/</span>

                <summary>

                    <span class="dr-summary-label">
                        DR
                    </span>

                    <span class="dr-total-summary">
                        Total:
                        <span id="dr-total">0</span>
                    </span>

                </summary>

                <div class="dr-sources">

                    <div class="dr-row">
                        <span class="dr-label">Armor</span>
                        <button class="adjust-button" type="button" data-stat="drArmor" data-delta="-1">−</button>
                        <input class="number-input stat-input" id="dr-armor" type="number" data-stat="drArmor" aria-label="Armor DR">
                        <button class="adjust-button" type="button" data-stat="drArmor" data-delta="1">+</button>

                    <div class="dr-row">

                        <button class="adjust-button" type="button" data-stat="drNatural" data-delta="-1">−</button>
                        <input class="number-input stat-input" id="dr-natural" type="number" data-stat="drNatural" aria-label="Natural DR">
                        <button class="adjust-button" type="button" data-stat="drNatural" data-delta="1">+</button>
                    </div>

                    <div class="dr-row">
                        <span class="dr-label">Magic</span>
                        <button class="adjust-button" type="button" data-stat="drMagic" data-delta="-1">−</button>
                        <input class="number-input stat-input" id="dr-magic" type="number" data-stat="drMagic" aria-label="Magic DR">
                        <button class="adjust-button" type="button" data-stat="drMagic" data-delta="1">+</button>
                    </div>

                </div>

            </details>
        </div>
    </details>

    <details class="control-section" id="conditions-section" open>
        <summary>Conditions</summary>
        <div class="section-body">
            <div class="add-row">
                <select id="condition-picker">
                    <option value="">Select condition…</option>
                </select>
                <select id="add-bone-picker" class="add-bone-picker" hidden aria-label="Bone break location">
                    <option value="Rib">Rib</option>
                    <option value="Arm">Arm</option>
                    <option value="Leg">Leg</option>
                    <option value="Skull">Skull</option>
                    <option value="Neck">Neck</option>
                </select>
                <button id="add-condition-button" type="button">+ Condition</button>
            </div>

            <div class="condition-list" id="condition-list">

            </div>
        </div>
    </details>
</div>

<script>
const RPG_DB_NAME = "rpgUnleashedCharactersDB";
const RPG_DB_VERSION = 1;
const RPG_CHARACTER_STORE = "characters";

function openCharacterDatabase() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(RPG_DB_NAME, RPG_DB_VERSION);

        request.addEventListener("upgradeneeded", event => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(RPG_CHARACTER_STORE)) {
                db.createObjectStore(RPG_CHARACTER_STORE, { keyPath: "id" });
            }
        });

        request.addEventListener("success", () => resolve(request.result));
        request.addEventListener("error", () => reject(request.error));
    });
}

async function getAllCharacters() {
    const db = await openCharacterDatabase();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(RPG_CHARACTER_STORE, "readonly");
        const request = transaction.objectStore(RPG_CHARACTER_STORE).getAll();

        request.addEventListener("success", () => resolve(request.result || []));
        request.addEventListener("error", () => reject(request.error));
        transaction.addEventListener("complete", () => db.close());
    });
}

async function getCharacterById(characterId) {
    const db = await openCharacterDatabase();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(RPG_CHARACTER_STORE, "readonly");
        const request = transaction.objectStore(RPG_CHARACTER_STORE).get(characterId);

        request.addEventListener("success", () => resolve(request.result || null));
        request.addEventListener("error", () => reject(request.error));
        transaction.addEventListener("complete", () => db.close());
    });
}

async function putCharacter(character) {
    const db = await openCharacterDatabase();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(RPG_CHARACTER_STORE, "readwrite");
        transaction.objectStore(RPG_CHARACTER_STORE).put(character);

        transaction.addEventListener("complete", () => {
            db.close();
            resolve(character);
        });

        transaction.addEventListener("error", () => reject(transaction.error));
    });
}

window.RPGCharacterStore = {
    getAllCharacters,
    getCharacterById,
    putCharacter
};

let tokenId = new URLSearchParams(window.location.search).get("tokenId") || "";

const statusMessage = document.getElementById("status-message");
const characterContextLabel = document.getElementById("character-context");
const conditionPicker = document.getElementById("condition-picker");
const addConditionButton = document.getElementById("add-condition-button");
const addBonePicker = document.getElementById("add-bone-picker");
const conditionList = document.getElementById("condition-list");

const statInputs = {
    hpCurrent: document.getElementById("hp-current"),
    hpMax: document.getElementById("hp-max"),
    manaCurrent: document.getElementById("mana-current"),
    manaMax: document.getElementById("mana-max"),
    nl: document.getElementById("nl"),
    drArmor: document.getElementById("dr-armor"),
    drNatural: document.getElementById("dr-natural"),

let conditionDefinitions = DEFAULT_CONDITION_DEFINITIONS;
let loadedContext = null;
let loadedRecord = null;
let saving = false;

function setStatus(message, kind = "") {
    statusMessage.className = "status" + (kind ? " " + kind : "");
    statusMessage.textContent = message || "";
}

function numberFromInput(input) {
    const raw = input?.value ?? input?.getAttribute("value") ?? 0;
    const value = Number(raw);
    return Number.isFinite(value) ? value : 0;
}

function setSavedInputValue(input, value) {
    if (!input) return;
    const normalized = Number.isFinite(Number(value)) ? Number(value) : 0;
    input.value = String(normalized);
    input.setAttribute("value", String(normalized));
}

function getConditionDefinition(conditionId) {
    return conditionDefinitions.find(definition => definition.id === conditionId) || null;
}

const BONE_BREAK_EFFECTS = {
    Rib: "-2 to Atk/Def, -2 to running checks.",
    Arm: "Cannot hold things using the broken arm. -2 to Atk/Def, -10 on climbing checks.",
    Leg: "Cannot run, 1/2 speed, -2 to Atk/Def, -10 on climbing checks. If both legs are broken, speed is reduced to 5 ft and -6 to Atk/Def.",
    Skull: "-4 to all checks, 30% chance to lose turn (roll at the start of the turn).",
    Neck: "No rules text has been set for a Neck break yet."
};

function conditionIdentity(condition) {
    if (condition?.id === "broken-bone") {
        return "broken-bone:" + (condition.boneType || "Rib");
    }

    return condition?.id || "";
}

function normalizeBoneBreakConditions(conditions) {
    const output = [];
    const byBone = new Map();

    for (const condition of conditions) {
        if (condition.id !== "broken-bone") {
            output.push(condition);
            continue;
        }

        const boneType = condition.boneType || "Rib";
        const existing = byBone.get(boneType);

        if (existing) {
            existing.stacks += Math.max(1, Number(condition.stacks) || 1);
            continue;
        }

        const entry = {
            ...condition,
            boneType,
            stacks: Math.max(1, Number(condition.stacks) || 1)
        };

        byBone.set(boneType, entry);
        output.push(entry);
    }

    return output;
}

function getConditionHelpText(condition) {
    if (condition?.id === "broken-bone") {
        const boneType = condition.boneType || "Rib";
        return boneType + ": " + (BONE_BREAK_EFFECTS[boneType] || "No rules text has been set for this break yet.");
    }

    return getConditionDefinition(condition?.id)?.description ||
        "No rules text has been set for this condition yet.";
}

function parseVitalsFromRecord(record) {
    const vitals = {
        hpCurrent: 0,
        hpMax: 0,
        manaCurrent: 0,
        manaMax: 0,
        nl: 0,
        drArmor: 0,
        drNatural: 0,
        drMagic: 0
    };

    const tab1Html = record?.state?.tabs?.tab1;
    if (typeof tab1Html === "string") {
        const template = document.createElement("template");
        template.innerHTML = tab1Html;

        const hpInputs = template.content.querySelectorAll(
            ".current-max-field .current-max-values input"
        );
        vitals.hpCurrent = numberFromInput(hpInputs[0]);
        vitals.hpMax = numberFromInput(hpInputs[1]);
        vitals.nl = numberFromInput(template.content.querySelector(".nl-field input"));

        const drInputs = template.content.querySelectorAll(".dr-bubbles input");
        vitals.drArmor = numberFromInput(drInputs[0]);
        vitals.drNatural = numberFromInput(drInputs[1]);
        vitals.drMagic = numberFromInput(drInputs[2]);
    }

    const tab5Html = record?.state?.tabs?.tab5;
    if (typeof tab5Html === "string") {
        const template = document.createElement("template");
        template.innerHTML = tab5Html;

        const manaCurrent = template.content.querySelector(".mana-current");
        const manaMax = template.content.querySelector(".mana-max");
        const legacyManapool = template.content.querySelector(
            'input[placeholder="Manapool"]'
        );

        if (manaCurrent || manaMax) {
            vitals.manaCurrent = numberFromInput(manaCurrent);
            vitals.manaMax = numberFromInput(manaMax);
        } else if (legacyManapool) {
            const legacyMana = numberFromInput(legacyManapool);
            vitals.manaCurrent = legacyMana;
            vitals.manaMax = legacyMana;
        }
    }

    return vitals;
}

function writeVitalsToRecord(record, vitals) {
    const nextRecord = {
        ...record,
        state: {
            ...record.state,
            tabs: {
                ...record.state?.tabs
            }
        }
    };

    const tab1Html = nextRecord.state.tabs.tab1;
    if (typeof tab1Html === "string") {
        const template = document.createElement("template");
        template.innerHTML = tab1Html;

        const hpInputs = template.content.querySelectorAll(
            ".current-max-field .current-max-values input"
        );
        setSavedInputValue(hpInputs[0], vitals.hpCurrent);
        setSavedInputValue(hpInputs[1], vitals.hpMax);
        setSavedInputValue(
            template.content.querySelector(".nl-field input"),
            vitals.nl
        );

        const drInputs = template.content.querySelectorAll(".dr-bubbles input");
        setSavedInputValue(drInputs[0], vitals.drArmor);
        setSavedInputValue(drInputs[1], vitals.drNatural);
        setSavedInputValue(drInputs[2], vitals.drMagic);

        nextRecord.state.tabs.tab1 = template.innerHTML;
    }

    const tab5Html = nextRecord.state.tabs.tab5;
    if (typeof tab5Html === "string") {
        const template = document.createElement("template");
        template.innerHTML = tab5Html;

        const manaCurrent = template.content.querySelector(".mana-current");
        const manaMax = template.content.querySelector(".mana-max");
        const legacyManapool = template.content.querySelector(
            'input[placeholder="Manapool"]'
        );

        if (manaCurrent || manaMax) {
            setSavedInputValue(manaCurrent, vitals.manaCurrent);
            setSavedInputValue(manaMax, vitals.manaMax);
        } else if (legacyManapool) {
            setSavedInputValue(legacyManapool, vitals.manaCurrent);
        }

        nextRecord.state.tabs.tab5 = template.innerHTML;
    }

    return nextRecord;
}

function getConditionDetailValues(card, conditionId) {
    const poisonType =
        card?.querySelector(".condition-poison-type")?.value ||
        card?.dataset?.poisonType ||
        "";

    const poisonInterval =
        card?.querySelector(".condition-poison-interval")?.value ||
        card?.dataset?.poisonInterval ||
        "Round";

    const poisonStacksRaw =
        card?.querySelector(".condition-poison-stacks-per-interval")?.value ??
        card?.dataset?.poisonStacksPerInterval ??
        "1";

    const poisonStacksPerInterval =
        Number(poisonStacksRaw);

    const boneType =
        card?.querySelector(".condition-bone-type")?.value ||
        card?.dataset?.boneType ||
        "";

    const bleedRaw =
        card?.querySelector(".condition-bleed-per-turn")?.value ??
        card?.dataset?.bleedPerTurn ??
        "";

    const bleedPerTurn =
        Number(bleedRaw);

    return {
        poisonType:
            conditionId === "unconscious"
                ? poisonType
                : "",
        poisonInterval:
            conditionId === "unconscious"
                ? poisonInterval
                : "",
        poisonStacksPerInterval:
            conditionId === "unconscious" &&
            Number.isFinite(poisonStacksPerInterval)
                ? Math.max(0, Math.floor(poisonStacksPerInterval))
                : 0,
        boneType:
            conditionId === "broken-bone"
                ? boneType
                : "",
        bleedPerTurn:
            conditionId === "bleeding" &&
            Number.isFinite(bleedPerTurn)
                ? Math.max(0, Math.floor(bleedPerTurn))
                : 0
    };
}

function conditionDetailHtml(condition) {
    if (condition.id === "unconscious") {
        const value = condition.poisonType || "Damage";
        const interval = condition.poisonInterval || "Round";
        const stacksPerInterval = Math.max(0, Number(condition.poisonStacksPerInterval) || 1);

                Poison Type

            <label class="condition-detail-field">
                Interval

                    ${["Round", "Minute", "Hour", "Day"].map(option =>

    return "";
}

function parseConditionsFromRecord(record) {
    const tab1Html = record?.state?.tabs?.tab1;
    if (typeof tab1Html !== "string") return [];

    const template = document.createElement("template");
    template.innerHTML = tab1Html;

    return Array.from(
        template.content.querySelectorAll(".condition-card")
    ).map(card => {
        const input = card.querySelector(".condition-stacks");
        const stacks = Number(
            input?.value ||
            input?.getAttribute("value") ||
            1
        );

        const id =
            card.dataset.conditionId ||
            "";

        return {
            id,
            stacks: Number.isFinite(stacks)
                ? Math.max(1, Math.floor(stacks))
                : 1,
            ...getConditionDetailValues(
                card,
                id
            )
        };
    }).filter(condition => Boolean(getConditionDefinition(condition.id)));
}

function writeConditionsToRecord(record, conditions) {
    const tab1Html = record?.state?.tabs?.tab1;
    if (typeof tab1Html !== "string") return record;

    const template = document.createElement("template");
    template.innerHTML = tab1Html;

    const list = template.content.querySelector(".active-condition-list");
    if (!list) return record;

    list.innerHTML = "";

    if (!conditions.length) {
        const empty = document.createElement("div");
        empty.className = "condition-empty-message";
        empty.textContent = "No active conditions.";
        list.appendChild(empty);
    }

    conditions.forEach(condition => {
        const definition = getConditionDefinition(condition.id);
        const card = document.createElement("div");

        card.className = "condition-card";
        card.dataset.conditionId = condition.id;

        if (condition.poisonType) {
            card.dataset.poisonType = condition.poisonType;
        }

        if (condition.id === "unconscious") {
            card.dataset.poisonInterval =
                condition.poisonInterval ||
                "Round";
            card.dataset.poisonStacksPerInterval =
                String(
                    Math.max(
                        0,
                        Number(condition.poisonStacksPerInterval) || 1
                    )
                );
        }

        if (condition.boneType) {
            card.dataset.boneType = condition.boneType;
        }

        if (condition.id === "bleeding") {
            card.dataset.bleedPerTurn =
                String(Math.max(0, Number(condition.bleedPerTurn) || 0));
        }

        const maxAttribute =
            definition?.maxStacks
                ? ' max="' + definition.maxStacks + '"'
                : "";

        card.innerHTML = `
            <span class="condition-card-name">
                ${definition?.name || condition.id}
            </span>

            <label class="condition-stack-field">
                Stacks
                <input
                    class="condition-stacks"
                    type="number"
                    min="1"
                    step="1"
                    ${maxAttribute}
                    value="${Math.max(1, Number(condition.stacks) || 1)}"
                >
            </label>

            ${conditionDetailHtml(condition)}

            <button
                class="remove-condition"
                type="button"
                title="Remove"
            >
                ×
            </button>
        `;

        list.appendChild(card);
    });

    return {
        ...record,
        state: {
            ...record.state,
            tabs: {
                ...record.state.tabs,
                tab1: template.innerHTML
            }
        }
    };
}

function readVitalsFromControls() {
    const vitals = {};

    Object.entries(statInputs).forEach(([key, input]) => {
        const value = Number(input?.value ?? 0);
        vitals[key] = Number.isFinite(value) ? value : 0;
    });

    return vitals;
}

function updateDrTotal() {
    const vitals = readVitalsFromControls();
    drTotal.textContent = String(
        vitals.drArmor +
        vitals.drNatural +
        vitals.drMagic
    );
}

function renderVitals() {
    const vitals = parseVitalsFromRecord(loadedRecord);

    Object.entries(statInputs).forEach(([key, input]) => {
        if (input) {
            input.value = String(vitals[key] ?? 0);
        }
    });

    updateDrTotal();
}

function renderConditionPicker() {
    conditionPicker.innerHTML = '<option value="">Select condition…</option>';

    conditionDefinitions.forEach(definition => {
        const option = document.createElement("option");
        option.value = definition.id;
        option.textContent = definition.name;
        conditionPicker.appendChild(option);
    });
}

function updateConditionAddOptions() {
    if (!addBonePicker) return;

    addBonePicker.hidden =
        conditionPicker.value !==
        "broken-bone";
}

conditionPicker.addEventListener(
    "change",
    updateConditionAddOptions
);

function renderConditions() {
    const conditions =
        normalizeBoneBreakConditions(
            parseConditionsFromRecord(
                loadedRecord
            )
        );

    conditionList.innerHTML = "";

    if (!conditions.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No active conditions.";
        conditionList.appendChild(empty);
        return;
    }

    conditions.forEach((condition, index) => {
        const definition = getConditionDefinition(condition.id);
        const row = document.createElement("div");
        const conditionKey = conditionIdentity(condition);
        const helpId =
            "help-" +
            condition.id +
            "-" +
            index;

        row.className = "condition-row";
        row.dataset.conditionKey = conditionKey;
        row.innerHTML = `
            <div class="condition-top">
                <span class="condition-name">
                    ${definition?.name || condition.id}
                </span>

                <button
                    class="icon-button minus-condition"
                    type="button"
                    data-condition-key="${conditionKey}"
                    title="Reduce stacks"
                >
                    −
                </button>

                <span class="stack-value">
                    ${condition.stacks}
                </span>

                <button
                    class="icon-button plus-condition"
                    type="button"
                    data-condition-key="${conditionKey}"
                    title="Add stacks"
                    ${definition?.maxStacks && condition.stacks >= definition.maxStacks ? "disabled" : ""}
                >
                    +
                </button>

                <button
                    class="icon-button info-condition"
                    type="button"
                    data-help-id="${helpId}"
                    title="What does this do?"
                >
                    ?
                </button>
            </div>

            ${renderConditionDetailEditor(condition, conditionKey)}

            <div class="condition-help" id="${helpId}">
                ${getConditionHelpText(condition)}
            </div>
        `;

        conditionList.appendChild(row);
    });

    conditionList.querySelectorAll(".minus-condition").forEach(button => {
        button.addEventListener("click", async () => {
            await changeConditionStacks(button.dataset.conditionKey, -1);
        });
    });

    conditionList.querySelectorAll(".plus-condition").forEach(button => {
        button.addEventListener("click", async () => {
            await changeConditionStacks(button.dataset.conditionKey, 1);
        });
    });

    conditionList.querySelectorAll(".info-condition").forEach(button => {
        button.addEventListener("click", () => {
            document
                .getElementById(button.dataset.helpId)
                ?.classList.toggle("active");
        });
    });

    conditionList.querySelectorAll(
        ".condition-poison-type, .condition-poison-interval, .condition-poison-stacks-per-interval, .condition-bone-type, .condition-bleed-per-turn"
    ).forEach(control => {
        control.addEventListener("change", async () => {
            await updateConditionDetail(
                control.dataset.conditionKey,
                control
            );
        });
    });
}

async function persistRecord(nextRecord) {
    if (!nextRecord || !loadedContext || saving) return false;

    saving = true;
    loadedRecord = nextRecord;
    setStatus("Saving…");

    try {
        const result = await window.RPGOwlbear.saveTokenLinkedCharacter({
            record: loadedRecord,
            remoteEditSession: loadedContext.remoteEditSession
        });

        loadedRecord = result.record;
        loadedContext = {
            ...loadedContext,
            remoteEditSession: result.remoteEditSession
        };

        renderVitals();
        renderConditions();
        setStatus("Saved.");
        return true;
    } catch (error) {
        console.error("Could not save token controls:", error);
        setStatus(
            error?.message || "Could not save changes.",
            "error"
        );
        return false;
    } finally {
        saving = false;
    }
}

async function persistVitals() {
    if (!loadedRecord || saving) return;

    const nextRecord = writeVitalsToRecord(
        loadedRecord,
        readVitalsFromControls()
    );

    await persistRecord(nextRecord);
}

async function adjustStat(stat, delta) {
    const input = statInputs[stat];
    if (!input || saving) return;

    const current = Number(input.value || 0);
    input.value = String(
        (Number.isFinite(current) ? current : 0) + delta
    );

    updateDrTotal();
    await persistVitals();
}

async function changeConditionStacks(conditionKey, delta) {
    if (saving || !loadedRecord) return;

    const current =
        normalizeBoneBreakConditions(
            parseConditionsFromRecord(
                loadedRecord
            )
        );

    const next = [];
    let handled = false;

    current.forEach(condition => {
        if (conditionIdentity(condition) !== conditionKey) {
            next.push(condition);
            return;
        }

        handled = true;

        const definition =
            getConditionDefinition(
                condition.id
            );

        let stacks =
            Math.max(
                0,
                condition.stacks + delta
            );

        if (definition?.maxStacks) {
            stacks =
                Math.min(
                    definition.maxStacks,
                    stacks
                );
        }

        if (stacks > 0) {
            next.push({
                ...condition,
                stacks
            });
        }
    });

    const nextRecord = writeConditionsToRecord(
        loadedRecord,
        next
    );

    await persistRecord(nextRecord);
}

async function updateConditionDetail(conditionKey, control) {
    if (saving || !loadedRecord) return;

    let current =
        normalizeBoneBreakConditions(
            parseConditionsFromRecord(
                loadedRecord
            )
        );

    current =
        current.map(condition => {
            if (conditionIdentity(condition) !== conditionKey) {
                return condition;
            }

            if (control.classList.contains("condition-poison-type")) {
                return {
                    ...condition,
                    poisonType:
                        control.value
                };
            }

            if (control.classList.contains("condition-poison-interval")) {
                return {
                    ...condition,
                    poisonInterval:
                        control.value
                };
            }

            if (control.classList.contains("condition-poison-stacks-per-interval")) {
                return {
                    ...condition,
                    poisonStacksPerInterval:
                        Math.max(
                            0,
                            Math.floor(
                                Number(control.value) || 0
                            )
                        )
                };
            }

            if (control.classList.contains("condition-bone-type")) {
                return {
                    ...condition,
                    boneType:
                        control.value
                };
            }

            if (control.classList.contains("condition-bleed-per-turn")) {
                return {
                    ...condition,
                    bleedPerTurn:
                        Math.max(
                            0,
                            Math.floor(
                                Number(control.value) || 0
                            )
                        )
                };
            }

            return condition;
        });

    current =
        normalizeBoneBreakConditions(
            current
        );

    await persistRecord(
        writeConditionsToRecord(
            loadedRecord,
            current
        )
    );
}

document.querySelectorAll(".adjust-button").forEach(button => {
    button.addEventListener("click", async () => {
        await adjustStat(
            button.dataset.stat,
            Number(button.dataset.delta || 0)
        );
    });
});

Object.values(statInputs).forEach(input => {
    input?.addEventListener("change", async () => {
        updateDrTotal();
        await persistVitals();
    });
});

addConditionButton.addEventListener("click", async () => {
    if (saving || !conditionPicker.value || !loadedRecord) return;

    const selectedId =
        conditionPicker.value;

    const selectedBone =
        selectedId === "broken-bone"
            ? (
                addBonePicker?.value ||
                "Rib"
            )
            : "";

    let current =
        normalizeBoneBreakConditions(
            parseConditionsFromRecord(
                loadedRecord
            )
        );

    if (
        selectedId ===
        "broken-bone"
    ) {

        const existing =
            current.find(
                condition =>
                    condition.id ===
                        "broken-bone" &&
                    (
                        condition.boneType ||
                        "Rib"
                    ) ===
                        selectedBone
            );

        if (
            existing
        ) {

            current =
                current.map(
                    condition =>
                        condition ===
                            existing
                            ? {
                                ...condition,
                                stacks:
                                    condition.stacks +
                                    1
                            }
                            : condition
                );

        }

        else {

            current.push({
                id:
                    "broken-bone",
                stacks:
                    1,
                boneType:
                    selectedBone
            });

        }

    }

    else {

        const existing =
            current.find(
                condition =>
                    condition.id ===
                    selectedId
            );

        if (
            existing
        ) {

            const definition =
                getConditionDefinition(
                    selectedId
                );

            current =
                current.map(
                    condition => {

                        if (
                            condition !==
                            existing
                        ) {

                            return condition;

                        }


                        const nextStacks =
                            condition.stacks +
                            1;


                        return {
                            ...condition,
                            stacks:
                                definition?.maxStacks
                                    ? Math.min(
                                        definition.maxStacks,
                                        nextStacks
                                    )
                                    : nextStacks
                        };

                    }
                );

        }

        else {

            current.push({
                id:
                    selectedId,
                stacks:
                    1,
                poisonType:
                    selectedId ===
                        "unconscious"
                        ? "Damage"
                        : "",
                poisonInterval:
                    selectedId ===
                        "unconscious"
                        ? "Round"
                        : "",
                poisonStacksPerInterval:
                    selectedId ===
                        "unconscious"
                        ? 1
                        : 0,
                bleedPerTurn:
                    selectedId ===
                        "bleeding"
                        ? 0
                        : 0
            });

        }

    }

    conditionPicker.value = "";
    updateConditionAddOptions();

    await persistRecord(
        writeConditionsToRecord(
            loadedRecord,
            current
        )
    );
});

async function initializeTokenControls() {
    try {
        if (!window.RPGOwlbear?.ready) {
            await new Promise(resolve => {
                window.addEventListener(
                    "rpg-owlbear-ready",
                    resolve,
                    { once: true }
                );
            });
        }

        conditionDefinitions =
            window.RPGOwlbear.conditionDefinitions ||
            DEFAULT_CONDITION_DEFINITIONS;

        if (!tokenId) {
            tokenId =
                await window.RPGOwlbear.getSelectedCharacterTokenId();
        }

        if (!tokenId) {
            characterContextLabel.textContent =
                "Select one Character token.";

            conditionList.innerHTML =
                '<div class="error-message">These controls work on one selected Character token at a time.</div>';

            setStatus(
                "No linked Character token selected.",
                "error"
            );
            return;
        }

        renderConditionPicker();
        updateConditionAddOptions();

        loadedContext =
            await window.RPGOwlbear.loadCharacterForTokenId(
                tokenId
            );

        if (!loadedContext?.record) {
            characterContextLabel.textContent =
                "No RPG Unleashed character is linked to this token.";

            conditionList.innerHTML =
                '<div class="error-message">Link a character to this token first.</div>';

            setStatus(
                "No linked character found.",
                "error"
            );
            return;
        }

        loadedRecord = loadedContext.record;

        const editMode =
            loadedContext.remoteEditSession
                ? "GM editing player character"
                : "Owner editing character";

        characterContextLabel.textContent =
            (loadedRecord.name || "Unnamed Character") +
            " • " +
            editMode;

        renderVitals();
        renderConditions();
        setStatus("Ready.");
    } catch (error) {
        console.error("Could not load token controls:", error);

        characterContextLabel.textContent =
            "Could not load linked character.";

        conditionList.innerHTML =
            '<div class="error-message">' +
            (error?.message || "The token controls could not load.") +
            '</div>';

        setStatus(
            error?.message || "Could not load token controls.",
            "error"
        );
    }
}
</script>

<script type="module" src="./owlbear-integration.js"></script>

<script>
initializeTokenControls();
</script>
