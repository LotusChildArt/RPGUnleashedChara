<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.json"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RPGUnleashedNotes</title>
<style>
:root{--bg:#fff;--surface:#fff;--raised:#e4e4e4;--fg:#111;--muted:#555;--edge:#111;--accent:#d9d9d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}
body.dark{--bg:#14171c;--surface:#20252d;--raised:#2b323d;--fg:#eef1f6;--muted:#d5dce6;--edge:#84909d;--accent:#405b82}
.shell{max-width:1000px;margin:auto;padding:22px 16px 60px}header,.line,.tools,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 15px}.muted,.subtitle,.footer,.result{color:var(--muted);font-size:13px}.subtitle{margin-top:5px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--edge);margin:22px 0 18px}.tab{border-radius:12px 12px 0 0;border-bottom:0;padding:11px 17px;white-space:nowrap}.tab.active{background:var(--surface);position:relative;top:2px}
.panel,.entry{border:2px solid var(--edge);border-radius:18px;background:var(--surface);padding:18px;margin-bottom:16px}.entry{padding:14px;margin:0 0 12px}
input,select,textarea,button,.import{font:14px Arial,sans-serif;color:var(--fg);background:var(--surface);border:2px solid var(--edge);border-radius:16px;padding:10px}
button,.import{font-weight:bold;cursor:pointer}button:hover,.import:hover{background:var(--raised)}button.primary{background:var(--accent)}
input,textarea,select{width:100%}textarea{min-height:80px;resize:vertical}.field{display:flex;flex-direction:column;gap:5px;min-width:0}label{font-size:13px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.actions{justify-content:flex-start;margin-top:14px}.tools{justify-content:flex-start;margin-top:14px}.tools input{width:78px}
.tag,.chip{display:inline-block;border:1px solid var(--edge);border-radius:16px;padding:4px 9px;font-size:12px;font-weight:bold;background:var(--raised)}
.hidden{display:none}.small{font-size:12px;padding:6px 10px}.date{font-size:12px;color:var(--muted);margin-top:5px}.footer{text-align:center;margin-top:24px}.result{margin-top:10px}
@media(max-width:610px){.grid{grid-template-columns:1fr}.shell{padding:14px 10px}.panel{padding:13px}.tab{padding:10px 12px}}
.app-screen{min-height:100vh;padding:34px 18px}.app-shell{max-width:820px;margin:auto}.app-brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}.app-brand h1{margin:0}.main-menu-actions{display:grid;gap:12px;max-width:460px}.main-menu-button,.back-button{min-height:48px;border:2px solid var(--edge);border-radius:24px;background:var(--surface);padding:8px 18px;cursor:pointer;font-weight:bold}.main-menu-button{width:100%;text-align:left;font-size:17px}.main-menu-button:hover,.back-button:hover{background:var(--raised)}.screen-hidden{display:none!important}.screen-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.screen-title h1{font-size:24px}.menu-symbol{width:72px;height:72px;border:2px solid var(--edge);border-radius:16px;display:grid;place-items:center;font-size:36px;font-weight:900}@media(max-width:610px){.app-screen{padding:24px 12px}}
.campaign-card{display:block;width:100%;text-align:left;margin:10px 0;border:2px solid var(--edge);border-radius:20px;padding:16px;background:var(--surface)}.campaign-card:hover{background:var(--raised)}.subtabs{display:flex;gap:4px;width:100%;border-bottom:2px solid var(--edge);margin-bottom:18px}.subtabs button{flex:1 1 0;min-width:0;padding:12px 2px;text-align:center;border-radius:12px 12px 0 0;border-bottom:0;white-space:nowrap}.subtabs button.active{background:var(--raised)}.place-row,.person-row{border:1.5px solid var(--edge);border-radius:14px;padding:12px;margin:8px 0}.indent-tree{border-left:2px solid var(--edge);margin-left:14px;padding-left:14px}.field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.place-form{display:grid;gap:12px}.secondary{font-size:12px;color:var(--muted)}@media(max-width:610px){.field-row{grid-template-columns:1fr}}
.folder-node{margin:8px 0}.folder-heading{width:100%;text-align:left;display:flex;align-items:center;gap:10px;border-radius:15px;background:var(--surface);padding:12px}.folder-heading:hover{background:var(--raised)}.folder-chevron{display:inline-block;width:16px}.folder-children{border-left:2px solid var(--edge);margin:4px 0 6px 18px;padding-left:12px}.folder-children[hidden]{display:none}.folder-details{padding:5px 12px 10px}.folder-counter{margin-left:auto;color:var(--muted);font-size:12px}.folder-type{font-size:12px;color:var(--muted);font-weight:normal}.folder-row{display:flex;gap:8px;align-items:center}.folder-row .folder-heading{flex:1;min-width:0}.folder-row .small{flex:0 0 auto}.folder-description{white-space:pre-wrap}.empty-children{padding:10px;font-size:12px;color:var(--muted)}.folder-heading:focus-visible{outline:3px solid #728fbb;outline-offset:2px}
.place-hub-link{width:100%;text-align:left;border:1.5px solid var(--edge);border-radius:12px;padding:11px;margin:5px 0;background:var(--surface)}.place-hub-link:hover{background:var(--raised)}.place-hub-section{margin:16px 0}.place-hub-section h3{font-size:16px;margin:0 0 10px}.place-hub-heading{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.place-hub-heading button{flex:0 0 auto}.subtle-info{font-size:12px;color:var(--muted)}.folder-heading{background:var(--surface)}.folder-heading .place-title{font-weight:700}.folder-chevron{color:var(--muted)}
.place-comment{border:1px solid var(--edge);border-radius:13px;padding:11px;margin:9px 0}.place-comment p{white-space:pre-wrap;margin:8px 0 0}.place-edit-panel{margin:14px 0;padding:14px;border:1px solid var(--edge);border-radius:14px}.place-header-edit{margin-left:auto}.place-parent-link{font-size:14px;text-align:left;text-decoration:underline;border:none;padding:0;background:transparent}.comment-author{font-size:12px;font-weight:bold}.comment-date{font-size:11px;color:var(--muted)}.place-note-form{display:grid;gap:10px}
.thread-replies{margin:12px 0 0 14px;padding-left:12px;border-left:2px solid var(--edge)}.thread-reply{border:1px solid var(--edge);border-radius:12px;padding:10px;margin:8px 0}.thread-actions{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}.thread-compose{border:1px solid var(--edge);border-radius:12px;padding:12px;margin-top:10px;display:grid;gap:9px}.thread-compose textarea{min-height:70px}.thread-reply p{white-space:pre-wrap;margin:6px 0}
.note-controls{display:flex;justify-content:flex-end;gap:5px;margin-top:8px}.note-icon-button{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;font-size:19px;line-height:1;font-weight:700}.thread-actions{justify-content:space-between}.thread-reply .note-controls{margin-top:6px}
.place-form.hidden,#questFields.hidden{display:none!important}.place-add-toggle{display:block;width:100%;text-align:left;font-size:17px;font-weight:bold;border-radius:16px;padding:12px 15px}.place-add-toggle[aria-expanded="true"]{margin-bottom:14px}
.objective-card{touch-action:pan-y;user-select:none;cursor:pointer}.objective-current{border:2px solid var(--accent,#5286db)!important;background:rgba(75,140,220,.13)}.objective-completed> .line strong{text-decoration:line-through;opacity:.65}.objective-card:focus-visible{outline:2px solid var(--accent,#5286db);outline-offset:2px}
.objective-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.objective-details{margin-top:10px;padding-top:10px;border-top:1px solid var(--edge)}.objective-details.hidden{display:none!important}.objective-card{padding:12px 14px;margin:7px 0}
.place-note-form.hidden{display:none!important}.objective-completed .objective-title strong{text-decoration:line-through!important;opacity:.65}.note-source-row{display:flex;align-items:center;gap:8px;margin:9px 0}.note-source-row input{width:auto}
.thread-compose.hidden{display:none!important}
.hub-spacer{flex:1 1 auto;min-width:8px}.place-hub-heading h2{margin:0}.place-hub-heading>.small{flex:0 0 auto}
</style></head>
<body>
<section id="homeScreen" class="app-screen"><div class="app-shell"><div class="app-brand"><img src="icons/icon-192.png" alt="RPG Unleashed icon" class="menu-symbol" style="object-fit:contain;padding:0"><div><h1>RPG UNLEASHED</h1><div class="subtitle">NOTES · Campaign Manager</div></div></div><div class="main-menu-actions"><button class="main-menu-button" data-screen="campaign">Campaign</button><button class="main-menu-button" data-screen="rules">Rules</button><button class="main-menu-button" data-screen="options">Options</button></div></div></section>
<section id="rulesScreen" class="app-screen screen-hidden"><div class="app-shell"><div class="screen-title"><h1>Rules</h1></div></div></section>
<section id="optionsScreen" class="app-screen screen-hidden"><div class="app-shell"><div class="screen-title"><h1>Options</h1></div><div class="panel"><h2>Appearance</h2><div class="field"><label for="optionTheme">App theme</label><select id="optionTheme"><option value="light">Light</option><option value="dark">Dark</option></select></div></div></div></section>
<main id="campaignScreen" class="shell screen-hidden"><div class="screen-title"><h1 id="campaignScreenHeading">Campaigns</h1></div>
<section id="campaignPicker"><div class="panel"><h2>Your Campaigns</h2><div class="actions"><button class="primary" id="newCampaign">+ New Campaign</button></div><div id="campaignList"></div></div></section>
<section id="campaignWorkspace" class="hidden"><div class="line" style="margin-bottom:14px"><h2 id="campaignTitle"></h2></div><nav class="subtabs"><button data-camp-tab="quests" class="active">Quests</button><button data-camp-tab="places">Places</button><button data-camp-tab="people">People</button><button data-camp-tab="notes">Notes</button><button data-camp-tab="settings">Options</button></nav>
<section id="quests" class="camp-pane"><div class="panel"><h2>Quests</h2><div id="questList"></div><div id="questDetail" class="hidden"></div></div><div id="questEditor" class="panel"><button id="newQuest" class="place-add-toggle" aria-expanded="false" aria-controls="questFields">+ Quest</button><div id="questFields" class="hidden"><h2>Quest Details</h2><div class="place-form"><div class="field"><label for="questTitle">Title</label><input id="questTitle"></div><div class="field"><label for="questDescription">Description</label><textarea id="questDescription"></textarea></div><div class="field"><label for="questPlace">Associated location (optional)</label><select id="questPlace"><option value="">None</option></select></div><div class="field"><label for="questRewards">Rewards</label><input id="questRewards"></div><div class="field"><label for="questNotes">Quest Notes</label><textarea id="questNotes"></textarea></div><div class="field"><label for="questStatus">Status</label><select id="questStatus"><option>Active</option><option>Completed</option><option>Failed</option></select></div><div class="actions"><button id="saveQuest" class="primary">Save Quest</button><button id="cancelQuest">Cancel</button><button id="deleteQuest">Delete</button></div></div></div></div></section>
<section class="hidden camp-pane" id="notes"><nav class="tabs"><button class="tab active" data-tab="quick">Quick-Notes</button><button class="tab" data-tab="journal">Session Journal</button></nav><section id="quick"><div class="panel"><h2>Quick Notes</h2><div class="field"><label for="activity">We...</label><select id="activity"><option value="traveled">Traveled</option><option value="fought">Fought</option><option value="camped">Camped</option><option value="talked">Talked to</option><option value="visited">Visited</option></select></div><div id="activityFields" style="margin-top:12px"></div><div class="field" style="margin-top:12px"><label for="extra">Extra details (optional)</label><textarea id="extra" placeholder="Anything else you want to remember?"></textarea></div><div class="actions"><button class="primary" id="add">Add to Session Journal</button></div><div class="result" id="quickFeedback"></div></div></section>
<section class="hidden" id="journal"><div class="panel"><div class="line"><h2>Session Journal</h2></div><div id="entries"></div></div></section>
</section>
<section id="places" class="hidden camp-pane"><div class="panel" id="placeIndex"><h2>Places</h2><div id="placesTree"></div></div><div class="panel hidden" id="placeHub"></div><div class="panel" id="addPlacePanel"><button id="toggleAddPlace" class="place-add-toggle" aria-expanded="false" aria-controls="addPlaceFields">+ Place</button><div class="place-form hidden" id="addPlaceFields"><div class="field"><label for="placeName">Location name</label><input id="placeName" placeholder="e.g. Glenridge"></div><div class="field-row"><div class="field"><label for="placeType">Type</label><select id="placeType"><option>World</option><option>Country</option><option>Region</option><option>Capital</option><option>City</option><option selected>Town</option><option>Village</option><option>Shop</option><option>POI</option><option>Other</option></select></div><div class="field hidden" id="customPlaceWrap"><label for="customPlaceType">Other type (optional)</label><input id="customPlaceType" placeholder="Leave blank for Other"></div></div><div class="field"><label for="placeParent">Located within (optional)</label><select id="placeParent"><option value="">None — top level</option></select></div><div class="field"><label for="placeDescription">Description (optional)</label><textarea id="placeDescription"></textarea></div><button id="savePlace" class="primary">Add Location</button></div></div></section>
<section id="people" class="hidden camp-pane"><div class="panel"><h2>People</h2><div id="peopleList"></div><div id="personDetail" class="hidden"></div></div><div class="panel"><button id="toggleAddPerson" class="place-add-toggle" aria-expanded="false" aria-controls="addPersonFields">+ Person</button><div id="addPersonFields" class="place-form hidden"><div class="field"><label for="personName">Name</label><input id="personName" placeholder="e.g. Village Elder"></div><div class="field-row"><div class="field"><label for="personRole">Role / occupation</label><input id="personRole" placeholder="e.g. Blacksmith"></div><div class="field"><label for="personPlace">Current location (optional)</label><select id="personPlace"><option value="">None</option></select></div></div><div class="field"><label for="personDetails">Notes (optional)</label><textarea id="personDetails"></textarea></div><button id="savePerson" class="primary">Add Person</button></div></div></section>
<section id="settings" class="hidden camp-pane"><div class="panel"><h2>Options</h2><div class="main-menu-actions"><button id="campaignGoHome" class="main-menu-button">Main Menu</button><button id="campaignGoList" class="main-menu-button">Campaigns</button></div><div class="field" style="margin-top:18px"><label for="campaignGMName">GM name</label><input id="campaignGMName" placeholder="GM name"><button class="small" id="saveGMName">Save GM name</button></div><div class="field" style="margin-top:18px"><label for="campaignThemeToggle">Theme</label><select id="campaignThemeToggle"><option value="light">Light Mode</option><option value="dark">Dark Mode</option></select></div></div></section>
</section>
</main>
<script>
const $=id=>document.getElementById(id), KEY='RPGUnleashedNotes.v1', uid=()=>crypto.randomUUID();
const blank=(name,gm='')=>({id:uid(),name,gm,places:[],people:[],quests:[],entries:[]});
let stored;try{stored=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const state={theme:stored?.theme||'light',campaigns:Array.isArray(stored?.campaigns)?stored.campaigns:[],activeCampaignId:stored?.activeCampaignId||null};
state.campaigns.forEach(c=>{c.places ||= [];c.people ||= [];c.quests ||= [];c.entries ||= []});
let editingQuest=null, selectedQuestId=null, selectedPlaceId=null, selectedPersonId=null, lastParentChoice=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,version:2}))}catch(e){alert('Browser storage unavailable. Changes may not persist.')}}
function safe(v){return String(v??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
function current(){return state.campaigns.find(c=>c.id===state.activeCampaignId)}
function showScreen(name){if(name==='campaign'){state.activeCampaignId=null;$('campaignPicker').classList.remove('hidden');$('campaignWorkspace').classList.add('hidden');save();renderCampaigns()}['home','campaign','rules','options'].forEach(x=>$(x+'Screen').classList.toggle('screen-hidden',x!==name));window.scrollTo(0,0)}
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>showScreen(b.dataset.screen));
function theme(){document.body.classList.toggle('dark',state.theme==='dark');$('optionTheme').value=state.theme;$('campaignThemeToggle').value=state.theme}
$('optionTheme').onchange=()=>{state.theme=$('optionTheme').value;save();theme()};$('campaignThemeToggle').onchange=()=>{state.theme=$('campaignThemeToggle').value;save();theme()};
function renderCampaigns(){const c=current();$('campaignList').innerHTML=state.campaigns.map(x=>'<button class="campaign-card" data-open="'+safe(x.id)+'"><strong>'+safe(x.name)+'</strong><div class="secondary">'+x.places.length+' places · '+x.people.length+' people</div></button>').join('')||'<p class="muted">No campaigns created.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCampaign(b.dataset.open));$('campaignScreenHeading').textContent=c?.name||'Campaigns';$('campaignTitle').textContent=c?.gm?'GM: '+c.gm:'GM: Not set';if(c){$('campaignThemeToggle').value=state.theme;$('campaignGMName').value=c.gm||''}}
$('saveGMName').onclick=()=>{const c=current();if(!c)return;c.gm=$('campaignGMName').value.trim();save();renderCampaigns()};$('campaignGoHome').onclick=()=>showScreen('home');$('campaignGoList').onclick=()=>showScreen('campaign');function tab(name){if(name==='places'&&!selectedPlaceId)showPlaceIndex();document.querySelectorAll('[data-camp-tab]').forEach(b=>b.classList.toggle('active',b.dataset.campTab===name));document.querySelectorAll('.camp-pane').forEach(x=>x.classList.toggle('hidden',x.id!==name))}
document.querySelectorAll('[data-camp-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.campTab));
function openCampaign(id){selectedQuestId=null;$('questList').classList.remove('hidden');$('questDetail').classList.add('hidden');if(!state.campaigns.some(c=>c.id===id))return;state.activeCampaignId=id;$('campaignPicker').classList.add('hidden');$('campaignWorkspace').classList.remove('hidden');$('questEditor').classList.remove('hidden');toggleQuest(false);selectedPlaceId=null;selectedPersonId=null;tab('quests');save();render()}
$('newCampaign').onclick=()=>{const n=prompt('Campaign name');if(!n?.trim())return;const gm=prompt('GM name (optional)')||'';const c=blank(n.trim(),gm.trim());state.campaigns.push(c);openCampaign(c.id)};
$('toggleAddPlace').onclick=()=>{const panel=$('addPlaceFields');panel.classList.toggle('hidden');const open=!panel.classList.contains('hidden');$('toggleAddPlace').setAttribute('aria-expanded',String(open));$('toggleAddPlace').textContent=open?'− Place':'+ Place'};
$('placeType').onchange=()=>{$('customPlaceWrap').classList.toggle('hidden',$('placeType').value!=='Other');lastParentChoice='';renderParentSelect()};$('placeParent').onchange=()=>{lastParentChoice=$('placeParent').value};
const locationTypes=['World','Country','Region','Capital','City','Town','Village','Shop','POI','Other'];
const settlementTypes=['Capital','City','Town','Village'];
function allowedParent(type,parent){
 if(type==='World')return false;
 if(type==='Country')return parent.type==='World';
 if(type==='Region')return parent.type==='Country'||parent.type==='World';
 if(settlementTypes.includes(type))return ['Region','Country','World'].includes(parent.type);
 return true; // Shop, POI and Other are free-standing or inside any place.
}
const expandedPlaces=new Set();
function ancestryContains(c,id,ancestor){let seen=new Set();while(id&&!seen.has(id)){if(id===ancestor)return true;seen.add(id);id=c.places.find(p=>p.id===id)?.parentId}return false}
function parentOptions(c,type,exclude){return c.places.filter(p=>p.id!==exclude&&!ancestryContains(c,p.id,exclude)&&allowedParent(type,p))}
function suggestedParent(c,type){const eligible=parentOptions(c,type);if(!eligible.length)return '';const ranks=type==='Country'?['World']:type==='Region'?['Country','World']:settlementTypes.includes(type)?['Region','Country','World']:['Village','Town','City','Capital','Region','Country','World','Shop','POI','Other'];for(const rank of ranks){const matches=eligible.filter(p=>p.type===rank);if(matches.length===1)return matches[0].id;if(matches.length>1)return matches[matches.length-1].id}return eligible.length===1?eligible[0].id:''}
function renderParentSelect(){const c=current();if(!c)return;const type=$('placeType').value;const eligible=parentOptions(c,type);const choice=$('placeParent').value;const next=lastParentChoice!==null?lastParentChoice:choice;const valid=eligible.some(p=>p.id===next);$('placeParent').innerHTML='<option value="">None — independent location</option>'+eligible.map(p=>'<option value="'+safe(p.id)+'">'+safe(p.name)+' ('+safe(p.type)+')</option>').join('');$('placeParent').value=valid?next:suggestedParent(c,type);lastParentChoice=null}
function showPlaceIndex(){selectedPlaceId=null;$('placeIndex').classList.remove('hidden');$('addPlacePanel').classList.remove('hidden');$('placeHub').classList.add('hidden')}
function openPlace(id){selectedPlaceId=id;$('placeIndex').classList.add('hidden');$('addPlacePanel').classList.add('hidden');$('placeHub').classList.remove('hidden');renderPlaceHub();window.scrollTo(0,0)}
const expandedThreads=new Set();
function renderPlaceHub(){
 const c=current(),p=c?.places.find(x=>x.id===selectedPlaceId);
 if(!p){showPlaceIndex();return}
 p.comments ||= [];
 const children=c.places.filter(x=>x.parentId===p.id),people=c.people.filter(x=>x.placeId===p.id),quests=c.quests.filter(x=>x.placeId===p.id);
 const parent=c.places.find(x=>x.id===p.parentId);
 const options=parentOptions(c,locationTypes.includes(p.type)?p.type:'Other',p.id);

$('toggleObjective').onclick=()=>form.classList.contains('hidden')?showForm(null):form.classList.add('hidden');$('cancelObjective').onclick=()=>form.classList.add('hidden');
$('saveObjective').onclick=()=>{const title=$('objectiveTitle').value.trim();if(!title)return;const obj=editingObj||{id:uid(),revealed:false,progress:'Not started'};Object.assign(obj,{title,details:$('objectiveDetails').value.trim()});if(!editingObj)q.objectives.push(obj);save();renderQuestDetail()};
document.querySelectorAll('[data-reveal-objective]').forEach(b=>b.onclick=()=>{const o=q.objectives.find(x=>x.id===b.dataset.revealObjective);o.revealed=!o.revealed;save();renderQuestDetail()});
let lastObjectiveHold=0;const cycleObjective=(id)=>{const o=q.objectives.find(x=>x.id===id);if(!o)return;const next=o.progress==='Current'?'Completed':o.progress==='Completed'?'Not started':'Current';if(next==='Current')q.objectives.forEach(x=>{if(x.id!==id&&x.progress==='Current')x.progress='Not started'});o.progress=next;lastObjectiveHold=Date.now();save();renderQuestDetail()};
document.querySelectorAll('[data-cycle-objective]').forEach(el=>{let timer=null,origin=null;const cancel=()=>{if(timer!==null)clearTimeout(timer);timer=null;origin=null};el.addEventListener('pointerdown',e=>{if(e.target.closest('button,select,input,textarea'))return;if(e.button!==0)return;origin={x:e.clientX,y:e.clientY};timer=setTimeout(()=>{timer=null;origin=null;cycleObjective(el.dataset.cycleObjective)},650)});el.addEventListener('pointermove',e=>{if(origin&&Math.hypot(e.clientX-origin.x,e.clientY-origin.y)>12)cancel()});['pointerup','pointercancel','pointerleave'].forEach(name=>el.addEventListener(name,cancel));el.addEventListener('contextmenu',e=>{if(e.target.closest('button,select,input,textarea'))return;e.preventDefault()});el.addEventListener('keydown',e=>{if(e.target!==el)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();cycleObjective(el.dataset.cycleObjective)}})});
document.querySelectorAll('[data-cycle-objective]').forEach(el=>{let down=0;el.addEventListener('pointerdown',e=>{down=Date.now()});el.addEventListener('click',e=>{if(e.target.closest('button,select,input,textarea')||Date.now()-down>=600||Date.now()-lastObjectiveHold<800)return;const id=el.dataset.cycleObjective;if(expandedObjectives.has(id))expandedObjectives.delete(id);else expandedObjectives.add(id);renderQuestDetail()})});
document.querySelectorAll('[data-edit-objective]').forEach(b=>b.onclick=()=>showForm(q.objectives.find(x=>x.id===b.dataset.editObjective)));
document.querySelectorAll('[data-delete-objective]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this objective?'))return;q.objectives=q.objectives.filter(x=>x.id!==b.dataset.deleteObjective);save();renderQuestDetail()});
renderThreadNotes(q,'questComments');
}
function editQuest(id){const c=current(),q=c?.quests.find(x=>x.id===id);$('questPlace').innerHTML='<option value="">None</option>'+(c?.places||[]).map(p=>'<option value="'+safe(p.id)+'">'+safe(p.name)+'</option>').join('');$('questPlace').value=q?.placeId||'';editingQuest=q?.id||null;$('questTitle').value=q?.title||'';$('questDescription').value=q?.description||'';$('questRewards').value=q?.rewards||'';$('questNotes').value=q?.notes||'';$('questStatus').value=q?.status||'Active';$('deleteQuest').classList.toggle('hidden',!q);toggleQuest(true)}
$('newQuest').onclick=()=>{if(!$('questFields').classList.contains('hidden'))toggleQuest(false);else editQuest(null)};$('cancelQuest').onclick=()=>toggleQuest(false);
$('saveQuest').onclick=()=>{const c=current(),title=$('questTitle').value.trim();if(!c||!title)return;let q=c.quests.find(x=>x.id===editingQuest),prior=q?.status;if(!q){q={id:uid()};c.quests.push(q)}Object.assign(q,{title,description:$('questDescription').value,rewards:$('questRewards').value,placeId:$('questPlace').value,notes:$('questNotes').value,status:$('questStatus').value});if(q.status==='Completed'&&prior!=='Completed'){let who=prompt('Who completed this quest?','Entire party');if(who===null)who='The party';let received=prompt('Rewards received (may differ from offered):',q.rewards||'');if(received===null)received='';c.entries.push({id:uid(),title:'Quest Completed — '+title,body:(who||'The party')+' completed '+title+'.'+(q.description?' '+q.description:'')+(received?' Rewards received: '+received+'.':''),meta:'Quest completion'})}toggleQuest(false);save();render();if(selectedQuestId)renderQuestDetail()};
$('deleteQuest').onclick=()=>{const c=current();if(!c||!confirm('Delete this quest?'))return;c.quests=c.quests.filter(x=>x.id!==editingQuest);toggleQuest(false);save();render()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['quick','journal'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});
function renderActivity(){const c=current(),places=c?.places||[],people=c?.people||[];const choice=(id,label,items)=>'<div class="field"><label>'+label+'</label><select id="'+id+'">'+items.map(x=>'<option value="'+safe(x.name)+'">'+safe(x.name)+'</option>').join('')+'</select></div>';const a=$('activity').value;let fields='';if(a==='traveled')fields='<div class="grid">'+choice('from','From',places)+choice('to','To',places)+'<div class="field"><label>Time taken</label><input id="time" placeholder="Travel duration"></div></div>';else if(a==='camped')fields='<div class="field"><label>How many times?</label><input id="count" type="number" min="1" value="1"></div>';else if(a==='talked')fields=choice('subject','Person',people);else if(a==='visited')fields=choice('subject','Location',places);else fields='<div class="field"><label>Enemies</label><input id="subject" placeholder="Enemies encountered"></div>';$('activityFields').innerHTML=fields}
$('activity').onchange=renderActivity;
$('add').onclick=()=>{const c=current(),a=$('activity').value;if(!c)return;let body;if(a==='traveled'){if(!$('from')?.value||!$('to')?.value)return alert('Add places before recording travel.');body='We traveled from '+$('from').value+' to '+$('to').value+($('time').value?' in '+$('time').value:'')+'.'}else if(a==='camped')body='We camped '+Math.max(1,Number($('count').value)||1)+' time(s).';else{const target=$('subject')?.value?.trim();if(!target)return alert('Enter or select a subject first.');body='We '+(a==='talked'?'talked to':a)+' '+target+'.'}if($('extra').value.trim())body+=' '+$('extra').value.trim();c.entries.push({id:uid(),title:'Quick-Note',body,meta:'Party note'});$('extra').value='';save();render();$('quickFeedback').textContent='Added to journal.'};
function renderJournal(){const c=current();if(!c)return;$('entries').innerHTML=c.entries.slice().reverse().map(e=>'<div class="entry"><strong>'+safe(e.title)+'</strong><div class="date">'+safe((e.meta||'').replace(/Session \\d+ ?[·-]? ?/g,''))+'</div><p>'+safe(e.body)+'</p><button class="small" data-delete-entry="'+safe(e.id)+'">Delete</button></div>').join('')||'<p class="muted">No notes yet.</p>';document.querySelectorAll('[data-delete-entry]').forEach(b=>b.onclick=()=>{if(!confirm('Delete entry?'))return;c.entries=c.entries.filter(e=>e.id!==b.dataset.deleteEntry);save();render()})}
function render(){theme();renderCampaigns();renderPlacesPeople();renderQuests();renderActivity();renderJournal()}
state.activeCampaignId=null;$('campaignPicker').classList.remove('hidden');$('campaignWorkspace').classList.add('hidden');
render();
</script></body></html>
